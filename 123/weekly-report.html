<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارنامه هفتگی | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">📊 کارنامه هفتگی</h2>
    <div class="header-actions">
      <button class="quick-theme-toggle" id="quickThemeToggle" type="button" aria-label="تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="dashboard.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">🎯 داشبورد</a>
    </div>
  </div>
</header>

<main id="main-content">
  <div class="wr-wrap">

    <!-- ============ هدر کارنامه ============ -->
    <section class="wr-cover glass reveal" id="wrCover">
      <div class="wr-cover-glow"></div>
      <div class="wr-cover-top">
        <div class="wr-brand">
          <svg viewBox="0 0 48 48" fill="none" style="width:34px;height:34px;"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
          <span>پیرامید</span>
        </div>
        <div class="wr-period" id="wrPeriod">—</div>
      </div>

      <div class="wr-greeting">
        <h1 id="wrTitle">کارنامه‌ی هفته‌ی تو</h1>
        <p id="wrSubtitle">بیا ببینیم این هفته چیکار کردی 👀</p>
      </div>

      <div class="wr-hero-stats" id="wrHeroStats"></div>
    </section>

    <!-- ============ نمودار روزها ============ -->
    <section class="wr-chart-card glass reveal delay-1">
      <div class="wr-sec-head">
        <h3>📈 نمودار هفته</h3>
        <div class="wr-tabs-mini" id="wrChartTabs">
          <button class="wr-tab-mini active" data-view="bars" type="button">ستونی</button>
          <button class="wr-tab-mini" data-view="line" type="button">خطی</button>
        </div>
      </div>

      <div class="wr-chart-bars" id="wrChartBars"></div>
      <canvas class="wr-chart-line" id="wrChartLine" style="display:none;"></canvas>
    </section>

    <!-- ============ کارت‌های آماری ============ -->
    <section class="wr-cards">
      <div class="wr-card glass reveal delay-1">
        <div class="wr-card-icon wr-icon-best">🏆</div>
        <h4>بهترین روز</h4>
        <b id="wrBestDay">—</b>
        <span id="wrBestDayMin">—</span>
      </div>

      <div class="wr-card glass reveal delay-1">
        <div class="wr-card-icon wr-icon-trend">📊</div>
        <h4>روند هفته</h4>
        <b id="wrTrend">—</b>
        <span id="wrTrendSub">—</span>
      </div>

      <div class="wr-card glass reveal delay-2">
        <div class="wr-card-icon wr-icon-focus">🎯</div>
        <h4>تمرکز</h4>
        <b id="wrFocusCount">۰</b>
        <span>پومودورو کامل</span>
      </div>

      <div class="wr-card glass reveal delay-2">
        <div class="wr-card-icon wr-icon-fire">🔥</div>
        <h4>استمرار</h4>
        <b id="wrActiveDays">۰</b>
        <span>روز فعال از ۷</span>
      </div>
    </section>

    <!-- ============ تحلیل هوشمند ============ -->
    <section class="wr-analysis glass reveal delay-2">
      <div class="wr-sec-head">
        <h3>🧠 تحلیل هوشمند</h3>
      </div>
      <div class="wr-analysis-list" id="wrAnalysisList"></div>
    </section>

    <!-- ============ مقایسه با هفته قبل ============ -->
    <section class="wr-compare glass reveal delay-2" id="wrCompareCard">
      <div class="wr-sec-head">
        <h3>⚖️ مقایسه با هفته‌ی قبل</h3>
      </div>
      <div class="wr-compare-wrap" id="wrCompareWrap"></div>
    </section>

    <!-- ============ دکمه‌ها ============ -->
    <section class="wr-actions reveal delay-2">
      <button class="btn btn-solid" id="wrShareBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        دانلود کارنامه (PNG)
      </button>
      <button class="btn" id="wrPrevWeekBtn" type="button" style="background:var(--soft);color:var(--text);border:1px solid var(--border);">
        📅 هفته‌ی قبل
      </button>
    </section>

  </div>
</main>

<!-- ============ Canvas مخفی برای ساخت تصویر ============ -->
<canvas id="wrCanvas" width="1080" height="1920" style="display:none;"></canvas>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="weekly-report.js"></script>
</body>
</html>
