<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه‌ریز هفتگی | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">📅 برنامه‌ریز هفتگی</h2>
    <div class="header-actions">
      <button class="quick-theme-toggle" id="quickThemeToggle" type="button" aria-label="تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="dashboard.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">🎯 داشبورد</a>
    </div>
  </div>
</header>

<main id="main-content">
  <div class="pl-wrap">

    <!-- ============ هدر ============ -->
    <section class="pl-header glass reveal">
      <div class="pl-week-nav">
        <button class="pl-nav-btn" id="plPrevWeek" type="button" aria-label="هفته قبل">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="pl-week-info">
          <b id="plWeekLabel">—</b>
          <span id="plWeekRange">—</span>
        </div>
        <button class="pl-nav-btn" id="plNextWeek" type="button" aria-label="هفته بعد">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <button class="btn btn-solid" id="plTodayBtn" type="button" style="padding:9px 18px;font-size:.82em;">امروز</button>
    </section>

    <!-- ============ خلاصه هفته ============ -->
    <section class="pl-summary glass reveal delay-1">
      <div class="pl-summary-item">
        <b id="plPlannedTotal">۰</b>
        <span>دقیقه برنامه‌ریزی‌شده</span>
      </div>
      <div class="pl-summary-item pl-actual">
        <b id="plActualTotal">۰</b>
        <span>دقیقه واقعی</span>
      </div>
      <div class="pl-summary-item">
        <b id="plCompletionRate">۰٪</b>
        <span>نرخ تحقق برنامه</span>
      </div>
      <div class="pl-summary-item">
        <b id="plTaskCount">۰</b>
        <span>تسک انجام‌شده</span>
      </div>
    </section>

    <!-- ============ گرید هفته ============ -->
    <section class="pl-week-wrap glass reveal delay-1">
      <div class="pl-week" id="plWeek"></div>
    </section>

    <!-- ============ راهنما ============ -->
    <div class="pl-hint reveal delay-2">
      💡 روی هر خونه بزن تا یه جلسه‌ی مطالعه اضافه کنی. جلسات سبز یعنی انجام شده.
    </div>

  </div>
</main>

<!-- ============ مودال اضافه/ویرایش تسک ============ -->
<div class="modal-overlay" id="plTaskModal" role="dialog" aria-modal="true">
  <div class="modal-card glass" style="max-width:480px;">
    <div class="modal-head">
      <h3 id="plTaskModalTitle">➕ جلسه‌ی جدید</h3>
      <button class="modal-close" data-close="plTaskModal" aria-label="بستن">✕</button>
    </div>
    <div class="class-form" style="padding:20px 24px 26px;">
      <div style="display:flex;gap:10px;">
        <label style="flex:1;">
          <span>روز</span>
          <select id="plTaskDay" style="padding:12px 14px;border-radius:14px;border:1.5px solid var(--glass-border);background:var(--glass-bg);color:var(--text);font-size:.9em;outline:none;font-family:inherit;">
            <option value="0">شنبه</option>
            <option value="1">یک‌شنبه</option>
            <option value="2">دوشنبه</option>
            <option value="3">سه‌شنبه</option>
            <option value="4">چهارشنبه</option>
            <option value="5">پنج‌شنبه</option>
            <option value="6">جمعه</option>
          </select>
        </label>
        <label style="flex:1;">
          <span>ساعت شروع</span>
          <select id="plTaskHour" style="padding:12px 14px;border-radius:14px;border:1.5px solid var(--glass-border);background:var(--glass-bg);color:var(--text);font-size:.9em;outline:none;font-family:inherit;"></select>
        </label>
      </div>

      <label>
        <span>درس</span>
        <select id="plTaskSubject" style="padding:12px 14px;border-radius:14px;border:1.5px solid var(--glass-border);background:var(--glass-bg);color:var(--text);font-size:.9em;outline:none;font-family:inherit;"></select>
      </label>

      <label>
        <span>مدت (دقیقه)</span>
        <input type="number" id="plTaskDuration" min="15" max="300" step="15" value="60" style="padding:12px 14px;border-radius:14px;border:1.5px solid var(--glass-border);background:var(--glass-bg);color:var(--text);font-size:.9em;outline:none;">
      </label>

      <label>
        <span>توضیح (اختیاری)</span>
        <input type="text" id="plTaskNote" placeholder="مثلا: فصل ۳ زیست" style="padding:12px 14px;border-radius:14px;border:1.5px solid var(--glass-border);background:var(--glass-bg);color:var(--text);font-size:.9em;outline:none;">
      </label>

      <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="btn btn-solid" id="plTaskSave" type="button" style="flex:1;">ذخیره</button>
        <button class="btn" id="plTaskDelete" type="button" style="background:rgba(239,68,68,.12);color:#df6680;border:1px solid rgba(239,68,68,.3);display:none;">🗑 حذف</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="planner.js"></script>
</body>
</html>
