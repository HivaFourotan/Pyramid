<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون‌ساز | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
<style>
.qz-wrap{max-width:900px;margin:32px auto 80px;padding:0 20px;display:flex;flex-direction:column;gap:18px}
.qz-head{padding:26px 28px;border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.qz-head h1{font-size:1.3em;margin-bottom:4px}
.qz-head p{color:var(--muted);font-size:.9em}
.qz-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px;border-radius:20px;box-shadow:var(--shadow)}
.qz-stat{text-align:center;padding:14px 10px;border-radius:14px;background:var(--soft)}
.qz-stat b{display:block;font-size:1.6em;font-weight:900;color:var(--primary-dark);line-height:1;margin-bottom:4px}
.qz-stat span{font-size:.72em;color:var(--muted);font-weight:700}
.qz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.qz-card{padding:20px;border-radius:20px;box-shadow:var(--shadow);cursor:pointer;transition:.3s cubic-bezier(.34,1.4,.5,1);background:var(--glass-bg);border:1.5px solid var(--glass-border);display:flex;flex-direction:column;gap:12px}
.qz-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary-soft)}
.qz-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qz-card-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4em;background:linear-gradient(135deg,var(--primary),var(--primary-g3));color:#fff;box-shadow:0 6px 16px rgba(232,93,158,.25)}
.qz-card-menu{width:30px;height:30px;border-radius:50%;background:var(--soft);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85em;transition:.25s;flex-shrink:0;padding:0}
.qz-card-menu:hover{background:var(--primary);color:#fff;border-color:transparent}
.qz-card-title{font-size:1em;font-weight:800;color:var(--text);margin-bottom:4px;line-height:1.5}
.qz-card-meta{font-size:.75em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qz-card-badge{padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font-weight:800}
.qz-card-actions{display:flex;gap:8px;margin-top:auto}
.qz-btn-sm{flex:1;padding:9px 12px;border-radius:10px;border:none;font-family:inherit;font-size:.78em;font-weight:800;cursor:pointer;transition:.25s}
.qz-btn-sm.start{background:linear-gradient(135deg,var(--primary),var(--primary-g2));color:#fff}
.qz-btn-sm.edit{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.qz-btn-sm:hover{transform:translateY(-2px)}
.qz-btn-sm.start:hover{box-shadow:0 6px 16px rgba(232,93,158,.4)}
.qz-empty{text-align:center;padding:60px 20px}
.qz-empty-icon{font-size:4em;margin-bottom:14px;animation:qzFloat 3s ease-in-out infinite}
@keyframes qzFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.qz-empty h3{font-size:1.15em;margin-bottom:8px}
.qz-empty p{color:var(--muted);font-size:.9em;line-height:1.9;margin-bottom:22px;max-width:400px;margin-inline:auto}
.qz-form label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.qz-form label>span{font-size:.82em;font-weight:700;color:var(--muted)}
.qz-form input,.qz-form select,.qz-form textarea{padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--soft);color:var(--text);font-family:inherit;font-size:.92em;outline:none;transition:.25s;width:100%}
.qz-form input:focus,.qz-form select:focus,.qz-form textarea:focus{border-color:var(--primary);background:#fff}
body.dark .qz-form input:focus,body.dark .qz-form select:focus,body.dark .qz-form textarea:focus{background:#1a1015}
.qz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qz-opt-row{display:flex;align-items:center;gap:8px}
.qz-opt-row input[type="radio"]{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
.qz-opt-row input[type="text"]{padding:10px 12px;font-size:.88em}
.qz-q-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.qz-q-item{padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--border)}
.qz-q-item-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.qz-q-item-head b{font-size:.9em;font-weight:800;color:var(--text);line-height:1.6;flex:1}
.qz-q-item-head span{font-size:.7em;color:var(--muted);font-weight:700;white-space:nowrap}
.qz-q-item-opts{display:flex;flex-direction:column;gap:4px;font-size:.8em;color:var(--muted)}
.qz-q-item-opts .correct{color:#22c55e;font-weight:800}
.qz-q-actions{display:flex;gap:6px;margin-top:10px}
@media (max-width:560px){
  .qz-wrap{padding:0 14px;margin:22px auto 60px}
  .qz-head{padding:20px 18px;flex-direction:column;align-items:stretch;text-align:center}
  .qz-stats{grid-template-columns:1fr 1fr}
  .qz-grid{grid-template-columns:1fr}
  .qz-options{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">📝 آزمون‌ساز</h2>
    <div class="header-actions">
      <button class="quick-theme-toggle" id="quickThemeToggle" type="button" aria-label="تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="dashboard.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">🎯 داشبورد</a>
    </div>
  </div>
</header>

<main>
  <div class="qz-wrap">

    <div class="qz-head glass reveal">
      <div>
        <h1>📝 آزمون‌های من</h1>
        <p>آزمون بساز، سوال اضافه کن، از خودت امتحان بگیر</p>
      </div>
      <button class="btn btn-solid" id="createQuizBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        آزمون جدید
      </button>
    </div>

    <div class="qz-stats glass reveal delay-1" id="statsBox"></div>

    <div class="qz-grid" id="quizzesGrid"></div>

    <div class="qz-empty" id="emptyBox" style="display:none;">
      <div class="qz-empty-icon">📝</div>
      <h3>هنوز آزمونی نداری</h3>
      <p>سوالات درسی‌ت رو این‌جا جمع کن و بعد از خودت آزمون بگیر.</p>
      <button class="btn btn-solid" id="createQuizBtn2" type="button">اولین آزمون رو بساز</button>
    </div>

  </div>
</main>

<div class="modal-overlay" id="qzModal" role="dialog">
  <div class="modal-card glass" style="max-width:560px;">
    <div class="modal-head">
      <h3 id="qzModalTitle">آزمون جدید</h3>
      <button class="modal-close" id="qzModalClose" type="button">✕</button>
    </div>
    <div id="qzModalBody" style="padding:22px 24px 26px;max-height:72vh;overflow-y:auto;"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="quizzes.js"></script>
<script src="quiz-extras.js"></script>
</body>
</html>
