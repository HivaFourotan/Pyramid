<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مالک | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">پنل مالک</h2>

      <a href="index.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">خانه</a>
    </div>
  </div>
</header>

<main>
  <div class="owner-wrap">

    <div class="owner-tabs" id="ownerTabs">
      <button class="owner-tab active" data-tab="dashboard" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>داشبورد</span>
      </button>
      <button class="owner-tab" data-tab="users" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span>کاربران</span>
        <span class="owner-tab-badge" id="usersCount">۰</span>
      </button>
      <button class="owner-tab" data-tab="announcements" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
        <span>اعلانات</span>
      </button>
      <button class="owner-tab" data-tab="majors" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>رشته‌ها</span>
      </button>
<button class="owner-tab" data-tab="stories" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.9-6.2 3.9-1.6-7L2 9.2l7.1-.6z"/></svg>
  <span>رتبه‌برترها</span>
</button>
      <button class="owner-tab" data-tab="messages" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>پیام‌ها</span>
        <span class="owner-tab-badge" id="messagesCount" style="display:none">۰</span>
      </button>
      <button class="owner-tab" data-tab="activity" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
  <span>فعالیت‌ها</span>
</button>
      <button class="owner-tab" data-tab="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>تنظیمات</span>
      </button>
    </div>

    <div class="owner-panel active" data-panel="dashboard" id="panelDashboard"></div>
    <div class="owner-panel" data-panel="users" id="panelUsers"></div>
    <div class="owner-panel" data-panel="announcements" id="panelAnnouncements"></div>
    <div class="owner-panel" data-panel="majors" id="panelMajors"></div>
    <div class="owner-panel" data-panel="messages" id="panelMessages"></div>
    <div class="owner-panel" data-panel="activity" id="panelActivity"></div>
    <div class="owner-panel" data-panel="settings" id="panelSettings"></div>

  </div>
</main>

<div class="modal-overlay" id="ownerModal" role="dialog">
  <div class="modal-card glass" style="max-width:520px;">
    <div class="modal-head">
      <h3 id="ownerModalTitle">—</h3>
      <button class="modal-close" id="ownerModalClose" type="button">✕</button>
    </div>
    <div id="ownerModalBody" style="padding:22px 24px 26px;max-height:70vh;overflow-y:auto;"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="owner.js"></script>

</html>
