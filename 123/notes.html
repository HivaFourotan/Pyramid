<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفترچه یادداشت | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">📓 دفترچه یادداشت</h2>
    <div class="header-actions">
      <button class="quick-theme-toggle" id="quickThemeToggle" type="button" aria-label="تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="dashboard.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">🎯 داشبورد</a>
    </div>
  </div>
</header>

<main id="main-content">
  <div class="nt-wrap">

    <!-- ============ نوار بالا ============ -->
    <div class="nt-toolbar glass reveal">
      <div class="nt-search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="ntSearch" placeholder="جستجو در همه‌ی یادداشت‌ها..." autocomplete="off">
        <button class="nt-clear-search" id="ntClearSearch" type="button" style="display:none;">✕</button>
      </div>
      <button class="btn btn-solid" id="ntNewNote" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        یادداشت جدید
      </button>
    </div>

    <!-- ============ نوار فیلترها ============ -->
    <div class="nt-filters reveal delay-1" id="ntFilters"></div>

    <!-- ============ لیست یادداشت‌ها ============ -->
    <section class="nt-list" id="ntList"></section>

    <!-- ============ خالی ============ -->
    <div class="nt-empty" id="ntEmpty" style="display:none;">
      <div class="nt-empty-icon">📓</div>
      <h3 id="ntEmptyTitle">هنوز یادداشتی نداری</h3>
      <p id="ntEmptyDesc">اینجا می‌تونی نکته‌های درسی، فرمول‌ها، خلاصه‌ی فصل‌ها و هر چیزی که می‌خوای رو بنویسی.</p>
      <button class="btn btn-solid" id="ntEmptyNewBtn" type="button">اولین یادداشت رو بنویس</button>
    </div>

  </div>
</main>

<!-- ============ ادیتور (مودال تمام‌صفحه) ============ -->
<div class="nt-editor" id="ntEditor">
  <div class="nt-editor-inner">
    <div class="nt-editor-head">
      <button class="nt-editor-close" id="ntEditorClose" type="button" aria-label="بستن">✕</button>
      <input type="text" id="ntEditorTitle" placeholder="عنوان یادداشت..." autocomplete="off">
      <div class="nt-editor-actions">
        <button class="nt-icon-btn" id="ntEditorFav" type="button" title="ستاره‌دار">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17l-6.2 3.9 1.6-7L2 9.2l7.1-.6z"/></svg>
        </button>
        <button class="nt-icon-btn" id="ntEditorDelete" type="button" title="حذف">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>
        </button>
        <button class="btn btn-solid" id="ntEditorSave" type="button" style="padding:9px 20px;font-size:.82em;">ذخیره</button>
      </div>
    </div>

    <div class="nt-editor-meta">
      <div class="nt-subject-pick" id="ntSubjectPick"></div>
      <div class="nt-tags-wrap" id="ntTagsWrap">
        <input type="text" id="ntTagInput" placeholder="تگ بزن و Enter...">
      </div>
    </div>

    <div class="nt-editor-body">
      <div class="nt-editor-toolbar">
        <button class="nt-tb" data-fmt="bold" type="button" title="بولد"><b>B</b></button>
        <button class="nt-tb" data-fmt="italic" type="button" title="ایتالیک"><i>I</i></button>
        <button class="nt-tb" data-fmt="underline" type="button" title="زیرخط"><u>U</u></button>
        <span class="nt-tb-sep"></span>
        <button class="nt-tb" data-fmt="h2" type="button" title="سرتیتر">H</button>
        <button class="nt-tb" data-fmt="list" type="button" title="لیست">•</button>
        <button class="nt-tb" data-fmt="num" type="button" title="لیست عددی">1.</button>
        <button class="nt-tb" data-fmt="quote" type="button" title="نقل قول">"</button>
        <span class="nt-tb-sep"></span>
        <button class="nt-tb" data-fmt="color" type="button" title="رنگ متن">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l-6 20h4l1-4h6l1 4h4zM9 14l3-10 3 10z"/></svg>
        </button>
        <button class="nt-tb" data-fmt="formula" type="button" title="فرمول ریاضی">∑</button>
        <button class="nt-tb" data-fmt="clear" type="button" title="پاک کردن فرمت">🧹</button>
      </div>

      <div class="nt-editor-content" id="ntEditorContent" contenteditable="true" spellcheck="false" data-placeholder="شروع کن به نوشتن... (نکته، فرمول، خلاصه‌ی فصل)"></div>
    </div>

    <div class="nt-editor-foot">
      <span id="ntEditorStats">۰ کاراکتر • ۰ کلمه</span>
      <span class="nt-editor-saved" id="ntEditorSaved">ذخیره‌شده</span>
    </div>
  </div>
</div>

<!-- ============ مودال تأیید ============ -->
<div class="modal-overlay" id="ntConfirmModal" role="dialog" aria-modal="true">
  <div class="modal-card glass" style="max-width:400px;">
    <div class="modal-head">
      <h3 id="ntConfirmTitle">تأیید</h3>
    </div>
    <div class="class-form" style="padding:20px 24px 26px;text-align:center;">
      <p id="ntConfirmText" style="line-height:1.9;margin-bottom:20px;">مطمئنی؟</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-solid" id="ntConfirmYes" type="button" style="flex:1;background:#df6680;">بله</button>
        <button class="btn" id="ntConfirmNo" type="button" style="flex:1;background:var(--soft);color:var(--text);border:1px solid var(--border);">انصراف</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="notes.js"></script>
</body>
</html>
