<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل من | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
<style>
  .account-wrap{ max-width:820px; margin:60px auto; padding:0 20px; }
  .account-card{ padding:36px 32px; border-radius:24px; box-shadow:var(--shadow-lg); }
  .account-avatar-row{ display:flex; align-items:center; gap:22px; margin-bottom:32px; flex-wrap:wrap; }
  .avatar-preview{
    width:110px; height:110px; border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-g3));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:2.6em; font-weight:800;
    background-size:cover; background-position:center;
    box-shadow:var(--shadow-brand);
  }
  .avatar-upload{ display:flex; flex-direction:column; gap:10px; }
  .avatar-upload input[type="file"]{ display:none; }
  .gradient-row{ display:flex; gap:12px; }
  .grad-opt{
    width:56px; height:56px; border-radius:16px; cursor:pointer;
    border:3px solid transparent;
    transition:.25s;
  }
  .grad-opt.active{ border-color:#fff; box-shadow:0 0 0 3px var(--primary); }
  .grad-1{ background:linear-gradient(135deg,#e85d9e,#c78ae8); }
  .grad-2{ background:linear-gradient(135deg,#4a90d9,#82cdb5); }
  .grad-3{ background:linear-gradient(135deg,#f59e0b,#ea580c); }
  .form-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .form-row label{ font-size:.85em; font-weight:700; color:var(--muted); }
  .form-row input{
    padding:13px 16px; border-radius:14px;
    border:1.5px solid var(--glass-border);
    background:var(--glass-bg);
    color:var(--text); font-size:.95em; outline:none;
    transition:.25s;
  }
  .form-row input:focus{ border-color:var(--primary); }
</style>
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">پروفایل من</h2>
    <div class="header-actions">
      <button class="quick-theme-toggle" id="quickThemeToggle" type="button" aria-label="تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="index.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">خانه</a>
    </div>
  </div>
</header>

<main>
  <div class="account-wrap">
  <div class="account-wrap">
      <div class="account-wrap">

    <!-- ===== بخش لاگین (اگه کاربر لاگین نکرده) ===== -->
    <div class="account-card glass" id="accountLoginBox" style="display:none;">
      <h2 style="margin-bottom:8px;">🔐 اول وارد شو</h2>
      <p style="color:var(--muted);margin-bottom:24px;font-size:.92em;">
        برای دیدن پروفایل باید نام کاربری و رمزت رو وارد کنی.
      </p>
      <form id="accountLoginForm">
        <div class="form-row">
          <label for="accUser">نام کاربری</label>
          <input type="text" id="accUser" required placeholder="مثلا: hiva" autocomplete="username">
        </div>
        <div class="form-row">
          <label for="accPass">رمز عبور</label>
          <input type="password" id="accPass" placeholder="برای مالک: رمز مخصوص" autocomplete="current-password">
        </div>
        <div style="display:flex;gap:12px;margin-top:16px;">
          <button type="submit" class="btn btn-solid">ورود</button>
          <a href="index.html" class="btn" style="background:var(--soft);color:var(--text);border:1px solid var(--border);">بازگشت به خانه</a>
        </div>
      </form>
    </div>

    <!-- ===== بخش اصلی پروفایل (اگه کاربر لاگین کرده) ===== -->
    <div class="account-card glass" id="accountMainBox" style="display:none;">
    <div class="account-card glass">
      <h2 style="margin-bottom:8px;">✨ اطلاعات پروفایل</h2>

      <div class="account-avatar-row">
        <div class="avatar-preview" id="avatarPreview">ه</div>
        <div class="avatar-upload">
          <label for="avatarInput" class="btn btn-solid" style="cursor:pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            آپلود عکس
          </label>
          <input type="file" id="avatarInput" accept="image/*">
          <small style="color:var(--muted);">حداکثر ۲ مگابایت</small>
        </div>
      </div>

      <h3 style="margin-bottom:14px;font-size:.95em;">🎨 گرادیان پیش‌فرض</h3>
      <div class="gradient-row" style="margin-bottom:28px;">
        <div class="grad-opt grad-1" data-grad="g1" title="صورتی"></div>
        <div class="grad-opt grad-2" data-grad="g2" title="آبی-سبز"></div>
        <div class="grad-opt grad-3" data-grad="g3" title="نارنجی"></div>
      </div>

      <form id="profileForm">
        <div class="form-row">
          <label for="pName">نام نمایشی</label>
          <input type="text" id="pName" required placeholder="مثلا: هیوا">
        </div>
        <div class="form-row">
          <label for="pAge">سن</label>
          <input type="number" id="pAge" min="8" max="100" placeholder="۱۸">
        </div>
        <div class="form-row">
          <label for="pEmail">ایمیل</label>
          <input type="email" id="pEmail" placeholder="hiva@example.com">
        </div>
        <div style="display:flex;gap:12px;margin-top:20px;">
          <button type="submit" class="btn btn-solid">ذخیره تغییرات</button>
          <button type="button" class="btn" id="logoutBtn" style="background:var(--soft);color:var(--text);border:1px solid var(--border);">خروج از حساب</button>
        </div>
      </form>
    </div>
  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>
<script src="auth-lite.js"></script>
<script src="script.js"></script>
<script src="account.js"></script>
</body>
</html>
