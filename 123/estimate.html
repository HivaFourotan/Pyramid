<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تخمین کنکور | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
<style>
  .estimate-wrap{ max-width:820px; margin:50px auto; padding:0 20px; }
  .estimate-card{ padding:34px 30px; border-radius:24px; box-shadow:var(--shadow-lg); }
  .major-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:28px; }
  .major-btn{
    padding:18px; border-radius:16px; border:2px solid var(--glass-border);
    background:var(--glass-bg); color:var(--text);
    display:flex; align-items:center; gap:12px;
    font-weight:700; font-size:.95em; text-align:right;
    transition:.25s;
  }
  .major-btn:hover{ border-color:var(--primary); }
  .major-btn.active{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-dark); }
  .major-icon{
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--soft); font-size:1.3em;
  }
  .fields-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:24px; }
  .field-box label{ display:block; font-size:.85em; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .field-box input{
    width:100%; padding:12px 14px; border-radius:12px;
    border:1.5px solid var(--glass-border);
    background:var(--soft); color:var(--text);
    font-size:.95em; outline:none; text-align:right; direction:ltr;
  }
  .field-box input:focus{ border-color:var(--primary); background:#fff; }
  .result-big{
    font-size:3em; font-weight:800;
    background:linear-gradient(135deg,var(--primary),var(--primary-g3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-align:center; margin:10px 0;
  }
  .chart-mini{
    display:flex; align-items:flex-end; justify-content:space-around;
    height:160px; gap:6px; padding:16px; border-radius:16px;
    background:var(--soft); margin-top:20px;
  }
  .chart-mini .bar{
    flex:1; border-radius:6px 6px 0 0;
    background:linear-gradient(180deg,var(--primary-g3),var(--primary));
    height:0; transition:height 1s var(--ease);
    position:relative;
  }
  .chart-mini .bar::after{
    content:attr(data-v); position:absolute; top:-20px; left:50%;
    transform:translateX(-50%); font-size:10px; color:var(--primary-dark); font-weight:700;
  }
</style>
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">🧮 تخمین کنکور</h2>
    <div class="header-actions">
      <button class="quick-theme-toggle" id="quickThemeToggle" type="button" aria-label="تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="index.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">خانه</a>
    </div>
  </div>
</header>

<main>
  <div class="estimate-wrap">
    <div class="estimate-card glass">
      <h2 style="margin-bottom:8px;">📊 تخمین تراز و رتبه</h2>
      <p style="color:var(--muted);margin-bottom:24px;font-size:.92em;">گروه آزمایشی‌ت رو انتخاب کن و درصدها رو وارد کن.</p>

      <h3 style="margin-bottom:12px;font-size:.95em;">۱) انتخاب رشته</h3>
      <div class="major-grid" id="majorGrid"></div>

      <h3 style="margin-bottom:12px;font-size:.95em;">۲) درصد دروس</h3>
      <div class="fields-grid" id="fieldsGrid"></div>

      <div style="display:flex;gap:12px;">
        <button class="btn btn-solid" id="calcBtn2">محاسبه تراز</button>
        <button class="btn" id="resetBtn" style="background:var(--soft);color:var(--text);border:1px solid var(--border);">پاک کردن</button>
      </div>

      <div id="resultBox" style="display:none;margin-top:28px;">
        <div style="text-align:center;">
          <div style="font-size:.9em;color:var(--muted);margin-bottom:6px;">تراز تخمینی</div>
          <div class="result-big" id="resTaraz">۰</div>
          <div style="display:inline-block;padding:8px 20px;border-radius:var(--pill);background:var(--primary-soft);color:var(--primary-dark);font-weight:700;" id="resRank">رتبه: ۰</div>
        </div>
        <div class="chart-mini" id="resChart"></div>
      </div>
    </div>
  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="estimate.js"></script>
</body>
</html>
