<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اجرای آزمون | پیرامید</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
<style>
.tk-wrap{max-width:720px;margin:24px auto 60px;padding:0 18px;display:flex;flex-direction:column;gap:16px}

/* ============ Header ============ */
.tk-head{padding:18px 22px;border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tk-back{width:42px;height:42px;border-radius:14px;background:var(--soft);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.25s;text-decoration:none}
.tk-back:hover{background:var(--primary);color:#fff;border-color:transparent}
.tk-back svg{width:20px;height:20px}
.tk-head-info{flex:1;min-width:0}
.tk-title{font-size:1.05em;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.tk-sub{font-size:.75em;color:var(--muted);font-weight:600}
.tk-timer{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font-weight:900;font-size:.9em;flex-shrink:0;font-variant-numeric:tabular-nums}
.tk-timer svg{width:16px;height:16px}
.tk-timer.warn{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;animation:tkPulse 1s ease-in-out infinite}
@keyframes tkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ============ Progress ============ */
.tk-progress-card{padding:16px 20px;border-radius:18px;box-shadow:var(--shadow)}
.tk-progress-head{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.82em;font-weight:700}
.tk-progress-head span{color:var(--muted)}
.tk-progress-head b{color:var(--primary-dark)}
.tk-bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden}
.tk-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-g3));border-radius:999px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ============ Question ============ */
.tk-q{padding:24px 22px;border-radius:22px;box-shadow:var(--shadow)}
.tk-q-num{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font-size:.75em;font-weight:800;margin-bottom:14px}
.tk-q-text{font-size:1.1em;font-weight:700;line-height:1.9;color:var(--text);margin-bottom:22px}
.tk-opts{display:flex;flex-direction:column;gap:10px}
.tk-opt{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:.95em;font-weight:600;cursor:pointer;text-align:right;transition:.25s cubic-bezier(.34,1.4,.5,1);width:100%}
.tk-opt:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px)}
.tk-opt-letter{width:34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:900;flex-shrink:0;transition:.25s}
.tk-opt-text{flex:1;line-height:1.6}
.tk-opt.selected{border-color:var(--primary);background:linear-gradient(135deg,var(--primary-soft),transparent);box-shadow:0 4px 14px rgba(232,93,158,.15)}
.tk-opt.selected .tk-opt-letter{background:linear-gradient(135deg,var(--primary),var(--primary-g3));color:#fff}

/* ============ Footer Actions ============ */
.tk-actions{display:flex;gap:10px}
.tk-btn{flex:1;padding:15px 20px;border-radius:16px;border:none;font-family:inherit;font-size:.95em;font-weight:800;cursor:pointer;transition:.25s cubic-bezier(.34,1.4,.5,1);display:flex;align-items:center;justify-content:center;gap:8px}
.tk-btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-g2));color:#fff;box-shadow:0 8px 20px rgba(232,93,158,.3)}
.tk-btn.primary:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(232,93,158,.45)}
.tk-btn.primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.tk-btn.ghost{background:var(--soft);color:var(--text);border:1px solid var(--border);flex:0 0 auto;padding:15px 22px}
.tk-btn.ghost:hover{border-color:var(--primary)}
.tk-btn svg{width:18px;height:18px}

/* ============ Skip Info ============ */
.tk-skip-info{text-align:center;font-size:.78em;color:var(--muted);font-weight:600}

/* ============ Result ============ */
.tk-result{padding:36px 28px;border-radius:24px;box-shadow:var(--shadow-lg);text-align:center;animation:tkResultIn .6s cubic-bezier(.34,1.4,.5,1)}
@keyframes tkResultIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.tk-result-emoji{font-size:5em;margin-bottom:12px;animation:tkResultPop .8s cubic-bezier(.34,1.4,.5,1)}
@keyframes tkResultPop{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.tk-result-title{font-size:1.4em;font-weight:900;color:var(--text);margin-bottom:10px}
.tk-result-score{font-size:3em;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary-g3));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin-bottom:8px}
.tk-result-label{color:var(--muted);font-size:.9em;font-weight:700;margin-bottom:24px}
.tk-result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.tk-result-stat{padding:14px 8px;border-radius:14px;background:var(--soft)}
.tk-result-stat b{display:block;font-size:1.4em;font-weight:900;line-height:1;margin-bottom:4px}
.tk-result-stat span{font-size:.72em;color:var(--muted);font-weight:700}
.tk-result-stat.correct b{color:#22c55e}
.tk-result-stat.wrong b{color:#df6680}
.tk-result-stat.skip b{color:#ad9da8}
.tk-result-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ============ Review ============ */
.tk-review{padding:22px;border-radius:20px;box-shadow:var(--shadow)}
.tk-review h3{font-size:1em;font-weight:800;margin-bottom:16px;color:var(--text)}
.tk-review-item{padding:14px 16px;border-radius:14px;background:var(--soft);margin-bottom:10px;border-right:3px solid var(--border)}
.tk-review-item.ok{border-right-color:#22c55e}
.tk-review-item.no{border-right-color:#df6680}
.tk-review-item.sk{border-right-color:#ad9da8}
.tk-review-q{font-size:.88em;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.7}
.tk-review-a{font-size:.82em;color:var(--muted);line-height:1.8;display:flex;flex-direction:column;gap:4px}
.tk-review-a span{display:flex;gap:8px}
.tk-review-a b{color:var(--text);font-weight:800}
.tk-review-ok{color:#22c55e;font-weight:800}
.tk-review-no{color:#df6680;font-weight:800;text-decoration:line-through}
.tk-review-explain{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.78em;color:var(--muted);line-height:1.8;border-left:3px solid var(--primary)}

/* ============ Empty ============ */
.tk-empty{text-align:center;padding:60px 20px}
.tk-empty-icon{font-size:4em;margin-bottom:12px}
.tk-empty h3{font-size:1.15em;margin-bottom:8px}
.tk-empty p{color:var(--muted);font-size:.9em;margin-bottom:20px}

@media (max-width:560px){
  .tk-wrap{padding:0 12px;margin:16px auto 40px}
  .tk-head{padding:14px 16px}
  .tk-title{font-size:.95em}
  .tk-q{padding:20px 16px}
  .tk-q-text{font-size:1em}
  .tk-opt{padding:12px 14px;gap:10px}
  .tk-opt-letter{width:30px;height:30px;font-size:.8em}
  .tk-result-grid{gap:6px}
  .tk-result-stat b{font-size:1.15em}
  .tk-result-actions .tk-btn{flex:1 1 100%}
  .tk-btn.ghost{padding:15px 16px}
}
</style>
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none"><path d="M24 4 L44 40 H4 Z" fill="currentColor" opacity=".85"/><path d="M24 4 L34 22 L14 22 Z" fill="currentColor"/></svg>
    </a>
    <h2 style="flex:1;text-align:center;font-size:1.05em;">📝 آزمون</h2>
    <div class="header-actions">
      <button class="quick-theme-toggle" id="quickThemeToggle" type="button" aria-label="تم">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="quizzes.html" class="btn btn-solid" style="padding:9px 20px;font-size:.85em;">لیست آزمون‌ها</a>
    </div>
  </div>
</header>

<main>
  <div class="tk-wrap" id="tkWrap"></div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="quizzes.js"></script>
<script src="quiz-take.js"></script>
</body>
</html>
